name: Test macOS Developer ID signing

on:
  workflow_dispatch:
    inputs:
      notarize:
        description: Submit the DMG to Apple and staple the notarization ticket
        required: true
        default: false
        type: boolean
      architecture:
        description: macOS architecture to sign and verify
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - x64

permissions:
  contents: read

concurrency:
  group: test-macos-signing
  cancel-in-progress: true

jobs:
  sign-and-verify:
    runs-on: ${{ inputs.architecture == 'x64' && 'macos-15-intel' || 'macos-14' }}
    env:
      MACOS_ARCH: ${{ inputs.architecture }}

    steps:
      - name: Check out selected ref
        uses: actions/checkout@v5

      - name: Set up build tools
        uses: ./.github/actions/setup-build

      - name: Import Developer ID certificate
        id: signing
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: native/electron/scripts/import-signing-keychain.sh "test-${MACOS_ARCH}"

      - name: Build and verify signed DMG
        env:
          MACOS_PACKAGE_ARCH: ${{ inputs.architecture }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          SKIP_NPM_CI: "1"
        run: native/electron/scripts/package-dmg.sh

      - name: Notarize and staple test DMG
        if: ${{ inputs.notarize }}
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_APP_SPECIFIC_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./native/electron/package.json').version")"
          native/electron/scripts/notarize-dmg.sh \
            "native/electron/dist/LINE-Cheater-${version}-macOS-${MACOS_ARCH}.dmg"

      - name: Refresh checksums after DMG stapling
        if: ${{ inputs.notarize }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./native/electron/package.json').version")"
          cd native/electron/dist
          shasum -a 256 \
            "LINE-Cheater-${version}-macOS-${MACOS_ARCH}.zip" \
            "LINE-Cheater-${version}-macOS-${MACOS_ARCH}.dmg" \
            > SHA256SUMS.txt

      - name: Verify signed app and DMG
        env:
          MACOS_PACKAGE_ARCH: ${{ inputs.architecture }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_VERIFY_GATEKEEPER: "1"
        run: native/electron/scripts/verify-macos-package.sh

      - name: Upload signed test artifacts
        uses: actions/upload-artifact@v6
        with:
          name: line-cheater-macos-signed-test-${{ github.run_id }}
          if-no-files-found: error
          path: |
            native/electron/dist/LINE-Cheater-*-macOS-${{ inputs.architecture }}.dmg
            native/electron/dist/LINE-Cheater-*-macOS-${{ inputs.architecture }}.zip
            native/electron/dist/SHA256SUMS.txt

      - name: Remove temporary signing material
        if: ${{ always() && steps.signing.outputs.available == 'true' }}
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
        run: security delete-keychain "$KEYCHAIN_PATH" || true
