name: Build and release macOS DMG

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "native/**"
      - ".github/workflows/release-macos.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "native/**"
      - ".github/workflows/release-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  checks:
    if: ${{ github.event_name != 'workflow_run' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            run_common_checks: true
          - arch: x64
            runner: macos-15-intel
            run_common_checks: false
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        if: ${{ github.event_name != 'push' || matrix.run_common_checks }}
        uses: actions/checkout@v5

      - name: Set up Node.js
        if: ${{ github.event_name != 'push' || matrix.run_common_checks }}
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/electron/package-lock.json

      - name: Set up Rust
        if: ${{ github.event_name != 'push' || matrix.run_common_checks }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Electron dependencies
        if: ${{ github.event_name != 'push' || matrix.run_common_checks }}
        working-directory: native/electron
        run: npm ci

      - name: Install Electron runtime
        if: ${{ github.event_name != 'push' || matrix.run_common_checks }}
        working-directory: native/electron
        run: node node_modules/electron/install.js

      - name: Check Rust formatting
        if: ${{ matrix.run_common_checks }}
        run: cargo fmt --all --check

      - name: Run Rust tests
        if: ${{ matrix.run_common_checks }}
        run: cargo test --workspace

      - name: Run Rust clippy
        if: ${{ matrix.run_common_checks }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Electron tests
        if: ${{ matrix.run_common_checks }}
        working-directory: native/electron
        run: npm test

      - name: Audit production dependencies
        if: ${{ matrix.run_common_checks }}
        working-directory: native/electron
        run: npm audit --omit=dev

      - name: Build and verify macOS app and DMG
        if: ${{ github.event_name != 'push' }}
        working-directory: native/electron
        env:
          MACOS_PACKAGE_ARCH: ${{ matrix.arch }}
          SKIP_NPM_CI: "1"
          SKIP_NPM_TEST: "1"
        run: ./scripts/package-dmg.sh

      - name: Verify macOS package outputs
        if: ${{ github.event_name != 'push' }}
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) actual_arch="arm64" ;;
            x86_64) actual_arch="x64" ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          test "$actual_arch" = "$EXPECTED_ARCH"
          version="$(node -p "require('./native/electron/package.json').version")"
          app="native/electron/dist/mac-${EXPECTED_ARCH}/LINE Cheater.app"
          dmg="native/electron/dist/LINE-Cheater-${version}-macOS-${EXPECTED_ARCH}.dmg"
          zip="native/electron/dist/LINE-Cheater-${version}-macOS-${EXPECTED_ARCH}.zip"
          sums="native/electron/dist/SHA256SUMS.txt"
          test -d "$app"
          test -f "$dmg"
          test -f "$zip"
          test -f "$sums"
          /usr/bin/codesign --verify --deep --strict "$app"
          "$app/Contents/Resources/bin/line-cheater" --version
          (
            cd native/electron/dist
            shasum -a 256 -c SHA256SUMS.txt
          )
          /usr/bin/hdiutil verify "$dmg"

      - name: Upload macOS test artifact
        if: ${{ github.event_name != 'push' }}
        uses: actions/upload-artifact@v6
        with:
          name: line-cheater-macos-ci-${{ matrix.arch }}-${{ github.run_id }}
          if-no-files-found: error
          path: |
            native/electron/dist/LINE-Cheater-*-macOS-${{ matrix.arch }}.dmg
            native/electron/dist/LINE-Cheater-*-macOS-${{ matrix.arch }}.zip
            native/electron/dist/SHA256SUMS.txt

  prepare:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: checks
    runs-on: macos-14
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_commit: ${{ steps.version.outputs.version_commit }}

    steps:
      - name: Check out latest main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/electron/package-lock.json

      - name: Bump patch version after merge
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          commit_subject="$(git log -1 --format=%s)"
          if [[ "$commit_subject" == "chore(release): bump version to "* ]]; then
            echo "The latest main commit already contains the release version bump."
          else
            node native/electron/scripts/bump-version.cjs
            version="$(node -p "require('./native/electron/package.json').version")"
            git diff --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock native/core/Cargo.toml native/electron/package.json native/electron/package-lock.json
            git commit -m "chore(release): bump version to ${version} [skip release]"
            git push origin HEAD:main
          fi

          version="$(node -p "require('./native/electron/package.json').version")"
          version_commit="$(git rev-parse HEAD)"
          {
            echo "version=${version}"
            echo "version_commit=${version_commit}"
          } >> "$GITHUB_OUTPUT"

  package:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      MACOS_ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Check out release version
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.version_commit }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/electron/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Import macOS signing certificate
        id: signing
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "${MACOS_CERTIFICATE_BASE64}" || {
            echo "MACOS_CERTIFICATE_BASE64 is not configured." >&2
            exit 1
          }
          test -n "${MACOS_SIGN_IDENTITY}" || {
            echo "MACOS_SIGN_IDENTITY is not configured." >&2
            exit 1
          }

          keychain_path="$RUNNER_TEMP/line-cheater-build-${MACOS_ARCH}.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          certificate_path="$RUNNER_TEMP/line-cheater-signing-${MACOS_ARCH}.p12"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Install Electron dependencies
        working-directory: native/electron
        run: npm ci

      - name: Install Electron runtime
        working-directory: native/electron
        run: node node_modules/electron/install.js

      - name: Build and verify DMG
        env:
          MACOS_PACKAGE_ARCH: ${{ matrix.arch }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          SKIP_NPM_CI: "1"
          SKIP_NPM_TEST: "1"
        run: native/electron/scripts/package-dmg.sh

      - name: Notarize and staple DMG
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_APP_SPECIFIC_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          dmg="native/electron/dist/LINE-Cheater-${VERSION}-macOS-${MACOS_ARCH}.dmg"
          native/electron/scripts/notarize-dmg.sh "$dmg"

      - name: Refresh checksums after DMG stapling
        shell: bash
        run: |
          set -euo pipefail
          cd native/electron/dist
          shasum -a 256 \
            "LINE-Cheater-${VERSION}-macOS-${MACOS_ARCH}.zip" \
            "LINE-Cheater-${VERSION}-macOS-${MACOS_ARCH}.dmg" \
            > "SHA256SUMS-${MACOS_ARCH}.txt"

      - name: Verify release artifacts
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          app="native/electron/dist/mac-${MACOS_ARCH}/LINE Cheater.app"
          dmg="native/electron/dist/LINE-Cheater-${VERSION}-macOS-${MACOS_ARCH}.dmg"
          zip="native/electron/dist/LINE-Cheater-${VERSION}-macOS-${MACOS_ARCH}.zip"
          sums="native/electron/dist/SHA256SUMS-${MACOS_ARCH}.txt"
          test -d "$app"
          test -f "$dmg"
          test -f "$zip"
          test -f "$sums"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app"
          "$app/Contents/Resources/bin/line-cheater" --version
          grep -F "  LINE-Cheater-${VERSION}-macOS-${MACOS_ARCH}.dmg" "$sums"
          grep -F "  LINE-Cheater-${VERSION}-macOS-${MACOS_ARCH}.zip" "$sums"
          (
            cd native/electron/dist
            shasum -a 256 -c "SHA256SUMS-${MACOS_ARCH}.txt"
          )
          /usr/bin/hdiutil verify "$dmg"

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: line-cheater-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            native/electron/dist/LINE-Cheater-${{ needs.prepare.outputs.version }}-macOS-${{ matrix.arch }}.dmg
            native/electron/dist/LINE-Cheater-${{ needs.prepare.outputs.version }}-macOS-${{ matrix.arch }}.zip
            native/electron/dist/SHA256SUMS-${{ matrix.arch }}.txt

      - name: Remove temporary macOS signing material
        if: ${{ always() && steps.signing.outputs.available == 'true' }}
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/line-cheater-build-${MACOS_ARCH}.keychain-db" || true
          rm -f "$RUNNER_TEMP/line-cheater-signing-${MACOS_ARCH}.p12"

  publish:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - prepare
      - package
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Download architecture artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: line-cheater-macos-*
          path: native/electron/release-artifacts
          merge-multiple: false

      - name: Assemble and verify release assets
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          artifact_root="native/electron/release-artifacts"
          dist="native/electron/dist"
          arm64_root="$artifact_root/line-cheater-macos-arm64"
          x64_root="$artifact_root/line-cheater-macos-x64"
          mkdir -p "$dist"

          for arch in arm64 x64; do
            root="$artifact_root/line-cheater-macos-${arch}"
            test -f "$root/LINE-Cheater-${VERSION}-macOS-${arch}.dmg"
            test -f "$root/LINE-Cheater-${VERSION}-macOS-${arch}.zip"
            test -f "$root/SHA256SUMS-${arch}.txt"
            cp "$root/LINE-Cheater-${VERSION}-macOS-${arch}.dmg" "$dist/"
            cp "$root/LINE-Cheater-${VERSION}-macOS-${arch}.zip" "$dist/"
          done

          cat \
            "$arm64_root/SHA256SUMS-arm64.txt" \
            "$x64_root/SHA256SUMS-x64.txt" \
            > "$dist/SHA256SUMS.txt"
          (
            cd "$dist"
            shasum -a 256 -c SHA256SUMS.txt
          )

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          VERSION_COMMIT: ${{ needs.prepare.outputs.version_commit }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          dist="native/electron/dist"
          dmg_arm64="$dist/LINE-Cheater-${VERSION}-macOS-arm64.dmg"
          zip_arm64="$dist/LINE-Cheater-${VERSION}-macOS-arm64.zip"
          dmg_x64="$dist/LINE-Cheater-${VERSION}-macOS-x64.dmg"
          zip_x64="$dist/LINE-Cheater-${VERSION}-macOS-x64.zip"
          sums="$dist/SHA256SUMS.txt"
          notes=$'LINE Cheater macOS 12+ Apple Silicon 與 Intel (arm64/x64) 正式封裝。\n\n來源備份以唯讀方式開啟，候選輸出另存，不會覆寫原始檔。\n\n此版本的 arm64 與 x64 封裝均使用 Developer ID Application 簽署並完成 Apple notarization，DMG 已 stapled ticket。\n\n完整功能、安全規則與限制請參考 README：'
          notes+="https://github.com/${GITHUB_REPOSITORY}/blob/main/README.md"

          if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "$dmg_arm64" "$zip_arm64" "$dmg_x64" "$zip_x64" "$sums" \
              --repo "$REPOSITORY" \
              --clobber
            gh release edit "$tag" --repo "$REPOSITORY" --draft=false
          else
            gh release create "$tag" \
              "$dmg_arm64" "$zip_arm64" "$dmg_x64" "$zip_x64" "$sums" \
              --repo "$REPOSITORY" \
              --target "$VERSION_COMMIT" \
              --title "LINE Cheater v${VERSION}" \
              --notes "$notes" \
              --generate-notes
          fi
