name: Build Windows x64

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "native/**"
      - ".github/workflows/build-windows.yml"
      - ".github/workflows/release-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/electron/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Electron dependencies
        shell: bash
        working-directory: native/electron
        run: npm ci

      - name: Install Electron runtime
        shell: bash
        working-directory: native/electron
        run: node node_modules/electron/install.js

      - name: Build and verify Windows package
        shell: bash
        working-directory: native/electron
        run: npm run package:win

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = node -p "require('./native/electron/package.json').version"
          $zip = "native/electron/dist/LINE-Cheater-$version-Windows-x64.zip"
          $sums = "native/electron/dist/SHA256SUMS-Windows-x64.txt"
          if (!(Test-Path -LiteralPath $zip)) { throw "Missing Windows ZIP: $zip" }
          if (!(Test-Path -LiteralPath $sums)) { throw "Missing Windows checksum file: $sums" }
          $expected = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumLine = Get-Content -LiteralPath $sums | Select-Object -First 1
          if ($checksumLine -notmatch [regex]::Escape($expected)) {
            throw "Windows ZIP checksum does not match $sums"
          }

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v6
        with:
          name: line-cheater-windows-x64
          if-no-files-found: error
          path: |
            native/electron/dist/LINE-Cheater-*-Windows-x64.zip
            native/electron/dist/SHA256SUMS-Windows-x64.txt
